name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: dist/index.html is up to date with src/
        run: git diff --exit-code -- dist/ || (echo "::error::dist/index.html is stale. Run npm run build and commit it." && exit 1)
